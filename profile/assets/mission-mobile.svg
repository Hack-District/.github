<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
<title id="title">Hack District — Build beyond the familiar</title><desc id="desc">An animated monochrome mission console, with orbiting satellite, twinkling stars, lunar terrain, and a moving signal. Bay Area, Earth.</desc>
<style>
svg{--bg:#090a0c;--ink:#f4f4f5;--muted:#9b9da4;--line:#303239;--moon:#d6d7db;--crater:#a2a4ab;--terrain:#24262c;background:var(--bg)}
@media(prefers-color-scheme:light){svg{--bg:#f5f5f3;--ink:#17181b;--muted:#60636b;--line:#d0d1d4;--moon:#363941;--crater:#565b65;--terrain:#dddeda}}
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--ink)} .label{font-size:13px;letter-spacing:3px;fill:var(--muted)} .star{fill:var(--ink);opacity:.45;animation:twinkle 6s ease-in-out infinite} .s1{animation-delay:-2s}.s2{animation-delay:-4s}
.orbit{transform-origin:455px 155px;animation:orbit 30s linear infinite}.signal{animation:scan 7s ease-in-out infinite}.beacon{animation:twinkle 4s ease-in-out infinite} .cursor{animation:twinkle 3s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(410px)}}
@media(prefers-reduced-motion:reduce){.star,.orbit,.signal,.beacon,.cursor{animation:none}}
</style>
